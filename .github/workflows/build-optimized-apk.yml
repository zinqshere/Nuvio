name: Build Optimized APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: optimized-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build optimized Nuvio APKs
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      # The repository pins MPVKit as a git submodule. Do not recursively
      # initialize its nested submodules; the pinned checkout is sufficient
      # for the Android build and avoids the stale nested libass dependency.
      - name: Checkout pinned MPVKit
        shell: bash
        run: |
          set -euo pipefail
          MPVKIT_SHA="d5cf091c80368bbbc1bbf2d195fbc55d926df888"
          git clone --no-checkout https://github.com/NuvioMedia/MPVKit.git MPVKit
          git -C MPVKit checkout --detach "${MPVKIT_SHA}"
          git -C MPVKit config submodule.recurse false
          test "$(git -C MPVKit rev-parse HEAD)" = "${MPVKIT_SHA}"

      - name: Apply PCM volume-gain audio pipeline patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/patches/volume-gain-audio-sink.patch
          git apply .github/patches/volume-gain-audio-sink.patch
          git diff --check
          grep -q "NuvioVolumeGainAudioProcessor" composeApp/src/androidMain/kotlin/com/nuvio/app/features/player/PlayerEngine.android.kt

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare Android build configuration
        shell: bash
        env:
          RELEASE_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "${SDK_DIR}" || ! -d "${SDK_DIR}" ]]; then
            echo "Android SDK directory was not found." >&2
            exit 1
          fi

          # Always use the live official Nuvio discovery document for the
          # backend URL and public client key. This prevents an old GitHub
          # secret or hard-coded fallback from producing an APK that can no
          # longer authenticate after the official backend configuration changes.
          DISCOVERY_URL="https://api.nuvio.tv/.well-known/nuvio"
          discovery_json="$(curl --fail --silent --show-error --location --max-time 20 "${DISCOVERY_URL}")"
          NUVIO_SUPABASE_URL="$(jq -er '.backend_url' <<<"${discovery_json}")"
          NUVIO_SUPABASE_ANON_KEY="$(jq -er '.publishable_key' <<<"${discovery_json}")"
          EMAIL_PASSWORD_AUTH="$(jq -er '.capabilities.email_password_auth' <<<"${discovery_json}")"

          if [[ "${NUVIO_SUPABASE_URL%/}" != "https://api.nuvio.tv" ]]; then
            echo "Official discovery returned an unexpected backend URL: ${NUVIO_SUPABASE_URL}" >&2
            exit 1
          fi
          if [[ "${EMAIL_PASSWORD_AUTH}" != "true" ]]; then
            echo "Official backend does not advertise email/password authentication." >&2
            exit 1
          fi
          if [[ -z "${NUVIO_SUPABASE_ANON_KEY}" ]]; then
            echo "Official discovery returned an empty publishable key." >&2
            exit 1
          fi

          NUVIO_SUPABASE_FALLBACK_URL=""

          {
            printf 'sdk.dir=%s\n' "${SDK_DIR}"
            printf 'NUVIO_SUPABASE_URL=%s\n' "${NUVIO_SUPABASE_URL}"
            printf 'NUVIO_SUPABASE_ANON_KEY=%s\n' "${NUVIO_SUPABASE_ANON_KEY}"
          } > local.properties

          if [[ -z "${RELEASE_PROPERTIES_BASE64}" || -z "${RELEASE_KEYSTORE_BASE64}" ]]; then
            echo "Release signing secrets are required for update-compatible optimized APKs." >&2
            exit 1
          fi

          keystore_path="${RUNNER_TEMP}/nuvio-release.jks"
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"

          printf '%s' "${RELEASE_PROPERTIES_BASE64}" | base64 --decode > release-signing.properties
          sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' release-signing.properties
          printf '\nNUVIO_RELEASE_STORE_FILE=%s\n' "${keystore_path}" >> release-signing.properties
          cat release-signing.properties >> local.properties

          required_properties=(
            NUVIO_RELEASE_STORE_PASSWORD
            NUVIO_RELEASE_KEY_ALIAS
            NUVIO_RELEASE_KEY_PASSWORD
          )
          for property_name in "${required_properties[@]}"; do
            if ! grep -Eq "^${property_name}=.+" local.properties; then
              echo "Missing required property: ${property_name}" >&2
              exit 1
            fi
          done

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build optimized full release APKs
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g
        run: ./gradlew :androidApp:assembleFullRelease --no-daemon --stacktrace

      - name: Verify optimized APK output
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(androidApp/build/outputs/apk/full/release/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo "No optimized release APKs were produced." >&2
            exit 1
          fi
          printf 'Produced APKs:\n'
          printf ' - %s\n' "${apks[@]}"

      - name: Upload optimized APKs
        uses: actions/upload-artifact@v6
        with:
          name: nuvio-optimized-release-apks
          path: androidApp/build/outputs/apk/full/release/*.apk
          if-no-files-found: error
          retention-days: 14
